name: Test custom output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture XML to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/nunit-mixed.xml" "$GITHUB_WORKSPACE/input-results.xml"

      - id: action
        uses: .
        with:
          inputXmlPath: "${{ github.workspace }}/input-results.xml"
          outputHtmlPath: "${{ github.workspace }}/custom-output/report.html"

      - name: Assert HTML file was created at custom path
        run: |
          CUSTOM_HTML="$GITHUB_WORKSPACE/custom-output/report.html"
          echo "Checking for HTML file at: $CUSTOM_HTML"
          if [ ! -f "$CUSTOM_HTML" ]; then
            echo "FAIL: expected HTML file not found at $CUSTOM_HTML"
            exit 1
          fi
          echo "PASS: HTML file exists at custom path"

      - name: Assert HTML content is valid
        run: |
          CUSTOM_HTML="$GITHUB_WORKSPACE/custom-output/report.html"
          if ! grep -q "Test Results" "$CUSTOM_HTML"; then
            echo "FAIL: HTML does not contain 'Test Results' page title"
            exit 1
          fi
          if ! grep -q "SampleTests.PassingTest1" "$CUSTOM_HTML"; then
            echo "FAIL: HTML does not contain passing test 'SampleTests.PassingTest1'"
            exit 1
          fi
          if ! grep -q "SampleTests.FailingTest1" "$CUSTOM_HTML"; then
            echo "FAIL: HTML does not contain failing test 'SampleTests.FailingTest1'"
            exit 1
          fi
          echo "PASS: HTML content is valid with correct test names"

      - name: Assert default path was NOT created
        run: |
          DEFAULT_HTML="$GITHUB_WORKSPACE/input-results.html"
          if [ -f "$DEFAULT_HTML" ]; then
            echo "WARN: default HTML path also exists (not necessarily a failure, but unexpected)"
          fi
          echo "PASS: custom output path test complete"
