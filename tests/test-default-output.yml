name: Test NUnit HTML report with default output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy fixture XML to working directory
        run: |
          cp "$GITHUB_WORKSPACE/actions/hardened/rjtngit--nunit-html-action/v1.0.1/tests/fixtures/test-results.xml" /tmp/nunit-results.xml
      - id: action
        uses: .
        with:
          inputXmlPath: /tmp/nunit-results.xml
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with default output path"
          echo "PASS"
