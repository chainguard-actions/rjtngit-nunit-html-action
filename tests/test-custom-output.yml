name: Test custom output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputXmlPath: ${{ github.workspace }}/actions/hardened/rjtngit--nunit-html-action/v2.0.0/tests/fixtures/test-results.xml
          outputHtmlPath: ${{ github.workspace }}/custom-report.html
      - name: Assert custom HTML output was generated
        run: |
          EXPECTED_HTML="${GITHUB_WORKSPACE}/custom-report.html"
          echo "Checking for HTML output at: $EXPECTED_HTML"
          if [ ! -f "$EXPECTED_HTML" ]; then
            echo "FAIL: Expected HTML file not found at $EXPECTED_HTML"
            exit 1
          fi
          echo "PASS: HTML file was generated at custom path"
          if grep -qi "<html" "$EXPECTED_HTML"; then
            echo "PASS: Output file contains HTML content"
          else
            echo "FAIL: Output file does not contain HTML content"
            cat "$EXPECTED_HTML"
            exit 1
          fi
